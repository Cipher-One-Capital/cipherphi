# Runs the demo's browser tests against each Vercel deployment once it is
# ready: every PR preview, and production after a merge. The tests use live
# Stellar testnet, through the deployment's own server and keys.
#
# Vercel announces a ready deployment with a repository_dispatch event, which
# GitHub only acts on for workflows on the default branch. To test any URL by
# hand, run this workflow from the Actions tab with that URL.
name: Demo browser tests

on:
  repository_dispatch:
    types: [vercel.deployment.success]
  workflow_dispatch:
    inputs:
      url:
        description: Deployment URL to test
        required: true

permissions:
  contents: read

concurrency:
  group: demo-e2e-${{ github.event.client_payload.git.sha || github.run_id }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: demo/web
    env:
      # Lets the tests through Vercel's login on preview deployments.
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.git.sha || github.sha }}
      - name: Deployment URL
        run: |
          url="${{ github.event.client_payload.url || inputs.url }}"
          case "$url" in http*) ;; *) url="https://$url" ;; esac
          echo "BASE_URL=$url" >> "$GITHUB_ENV"
          echo "Testing $url (${{ github.event.client_payload.environment || 'manual' }})"
      - name: Deployment answers
        # Fail in seconds, not at the job timeout, when the URL is wrong or
        # Vercel's login is in the way (an empty or wrong bypass secret).
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" "$BASE_URL")
          echo "$BASE_URL answered $code"
          if [ "$code" != "200" ]; then
            echo "::error::$BASE_URL answered $code. Check the URL, and the VERCEL_AUTOMATION_BYPASS_SECRET for previews."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demo/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Four moments, then a first visit with tips
        run: npx playwright test e2e/four-moments.spec.ts e2e/tips.spec.ts --workers=1 --retries=1 --reporter=line
      - if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: demo/web/test-results
          retention-days: 7
