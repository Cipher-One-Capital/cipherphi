[workspace]
resolver = "2"
members = ["interface", "zakat_pool", "policy", "attestation"]
# The fuzz crate needs nightly and libfuzzer, and must never reach the
# reproducible build, so it has its own lockfile and workspace.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
soroban-sdk = "27.0.6"
ed25519-dalek = "2.2.0"
cipherphi_interface = { path = "interface" }
policy = { path = "policy" }
attestation = { path = "attestation" }

# Deliberately not a `rust-toolchain.toml`. The pinned build image is the
# toolchain pin: see ops/build.conf.

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
