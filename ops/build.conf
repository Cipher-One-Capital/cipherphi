# The pinned build toolchain, in SEP-58 vocabulary. Single source of truth for
# build.sh, make-source-archive.sh and CI. The image is
# the demo's: see demo/build.conf for why the digest is single-arch and carries
# an explicit registry host.
BLDIMG="docker.io/stellar/stellar-cli@sha256:7040ab64bb977006c2b7466fc5face9a1ef317a53e494564d7d6ddb083cd032a"
BLDIMG_TAG="stellar/stellar-cli:27.1.0-rust1.97.1-slim-trixie (linux/amd64)"
BUILD_PLATFORM="linux/amd64"

# Flags passed verbatim to `stellar contract build` and recorded in each Wasm.
# Without --locked, cargo may re-resolve against the registry.
BLDOPT=(--locked)

# One archive holds the whole workspace, and one build produces all three Wasm
# files, so each records the same source_sha256. The archive is not committed:
# make-source-archive.sh regenerates identical bytes from any commit.
SOURCE_PREFIX="cipherphi-contracts-0.1.0"
SOURCE_ARCHIVE="sources/cipherphi-contracts-0.1.0.tar"

WASM_NAMES=(zakat_pool.wasm policy.wasm attestation.wasm)
